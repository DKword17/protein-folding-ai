# ═══════════════════════════════════════════════════════════════════════
#  CI configuration for protein-folding-ai
# ═══════════════════════════════════════════════════════════════════════
#
#  Triggers:
#    - push / pull_request on main and all dev/* branches
#
#  Jobs:
#    1.  test  —  unit tests with pytest + coverage (gate > 85 %)
#    2.  lint  —  flake8 and mypy static analysis
#
#  Author: Priya Sharma
#          Quality Engineering, Indian Institute of Science, Bengaluru
# ═══════════════════════════════════════════════════════════════════════

name: CI — Tests & Coverage

on:
  push:
    branches: [main, dev/*]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:

  # ──── Job 1: Unit tests + coverage ────────────────────────────────
  test:
    name: "Test (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov coverage flake8 mypy numpy
      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --verbose \
            --cov=folding_engine \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=85
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: coverage.xml

  # ──── Job 2: Lint (flake8 + mypy) ────────────────────────────────
  lint:
    name: "Lint (Python ${{ env.PYTHON_VERSION }})"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          python -m pip install --upgrade pip
          pip install flake8 mypy numpy
      - run: |
          flake8 folding_engine.py tests/ \
            --max-line-length=100 \
            --ignore=E203,E266,W503 \
            --count --statistics
      - run: |
          mypy folding_engine.py \
            --ignore-missing-imports \
            --warn-unused-ignores \
            --show-error-codes \
            --strict-optional
